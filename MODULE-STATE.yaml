# MODULE-STATE.yaml — Rime of the Frostmaiden Foundry Module
# Source of truth for what has been built, what quality it is, and what track it belongs to.
# Three tracks: RAW (book), THIRD_PARTY (authorized supplements), HOMEBREW (Reed's ideas — design must precede build)
# Updated: Rime of the Frostmaiden — 2026-11-11 full refresh against packs-src at release 1.0.48
# Every list below was checked file by file against packs-src on 2026-11-11; releases 1.0.34–1.0.46 are logged in the changelog.

meta:
  module_id: rotf
  module_title: "Icewind Dale: Rime of the Frostmaiden"
  repo: Szoradrin/fm-rotf
  current_release: "1.0.48"
  foundry_version: "14.369"  # Reed's install, 2026-11-04. module.json compatibility.verified is still 14.368; bump it in the next release.
  system: dnd5e
  system_version: "5.3.3"
  sqyre: https://icewind-dale-rime-of-the-frostma-5d8b5fc8.us.sqyre.app/game

build_rules:
  - All RAW actors from D&D Beyond only — never from memory
  - No V13 fields ever
  - Compile via tools/build.py only — never invoke fvtt-cli directly
  - Verify packed-count == source-count after every compile
  - Release requires Reed approval

