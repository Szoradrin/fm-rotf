  module_title: "Icewind Dale: Rime of the Frostmaiden"
  repo: Szoradrin/fm-rotf
  current_release: "1.0.32"
  foundry_version: "14.366"  # module.json verified; Foundry stable is now 14.367 — bump on next content release
