# ==============================================================================
# CRITICAL BUILD RULES (burned in — never override)
# ==============================================================================

rules:
  - ALL actors from D&D Beyond only — never from memory, never from YAML
  - NO V13 fields ever — prototypeToken.texture.src not img, activities not damage.parts, no fog.exploration boolean, no globalLight boolean
  - Chrome first — when Reed says open Chrome, do it before writing anything
  - Commit without asking — only ask before compile + release
  - GitHub is source of truth — never Google Drive, never Google Docs
  - systemVersion must be "5.3.3" — not "5.0.3" (old standards doc has wrong version)
  - Verify in Foundry before calling anything done
  - Read STANDARDS docs before building any new document type

