# ==============================================================================
# CAMPAIGN ORIGIN
# ==============================================================================

origin_story: >
  The party began as prisoners of a frost giant. Rurik Lutgehr picked the locks and freed
  everyone, cell by cell. They fled north into the worst winter in living memory, arriving
  first at Dougan's Hole, then Bryn Shander. From there: Foaming Mugs (Bryn Shander), A
  Beautiful Mine (Termalaine), Black Cabin (Macreadus, the Summer Star device — needs a
  unicorn horn to activate), then Good Mead.

good_mead_full_detail: >
  Party arrived at Good Mead for "The Mead Must Flow" — town speaker already dead, election
  underway. Olivessa Untapoor ran reluctantly against a dwarf candidate secretly meeting with
  Targos (Zhentarim territory) to stage a fake "thug attack" for his own electoral benefit.
  Party uncovered the plot, killed the dwarf and his crew on the road. Party then covered
  the actual staged attack night themselves, beat back the real Zhentarim thugs. Olivessa won,
  became a genuine hero-speaker. Nobody in Good Mead knows the party killed the dwarf's crew.
