reed_campaign_goal:
  timeline: "Game session 25 (Nov 4) covers the Easthaven battle. Next known date: about Dec 23 or January."
  desired_ending_beat: >
    End the arc on a cliffhanger: Arveiaturace (the ancient white dragon) appears near Bryn
    Shander and notices the adventurers. Not an automatic fight; her purpose is not decided.
  guidance: >
    Quality over speed. No overland travel filler — Reed has explicitly said he does not
    want extra wilderness/travel scenes between story beats unless they add something.
    Party just arrives where they need to be next.

