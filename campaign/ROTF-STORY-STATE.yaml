book_structure:
  root_cause: "Auril, neutral evil goddess of winter, cast the Everlasting Rime. She is cold indifference, not an active mastermind."
  chapters:
    - "1. Ten-Towns — sandbox, side quests (WHERE MOST PLAY HAS HAPPENED)"
    - "2. Icewind Dale — wilderness sandbox (includes The Unseen, Caer-Konig)"
    - "3. Sunblight — Xardorok Sunblight builds the chardalyn dragon. SOURCED TODAY. Dragon is ALREADY launched by the time characters arrive, no matter what — this is baked into the chapter, not situational."
    - "4. Destruction's Light — the dragon attacks Ten-Towns in a fixed order, saving Bryn Shander for last. SOURCED TODAY."
    - "5. Auril's Abode — Vellynne Harpell reveals the Codicil of White, Island of Solstice. HELD IN RESERVE past the winter break."
    - "6. Caves of Hunger — brutal survival chapter, journey to the island. HELD IN RESERVE."
    - "7. Doom of Ythryn — buried Netherese flying city, a LICH (Iriolarthas), imprisoned illithid brain. HELD IN RESERVE — this is what's waiting if the campaign resumes after the break."
  key_villains:
    - {name: "Xardorok Sunblight", role: "Duergar warlord, believes his patron is Deep Duerra but is actually being used by Asmodeus. Building/has built the chardalyn dragon."}
    - {name: "The Chardalyn Dragon", role: "Cursed black crystal construct animated by dark magic. NOT a real dragon. Already launched, following a fixed attack path, saving Bryn Shander for last."}
    - {name: Auril, role: "Root cause. True final antagonist if the campaign ever goes that far."}
  key_allies:
    - {name: "Vellynne Harpell", role: "Wizard of the Arcane Brotherhood (Host Tower, Luskan). MEETS PARTY ON THE ROAD back from Sunblight per book canon — intercepts with sleds, offers a ride, wants their trust for her own Codicil of White quest later. Pragmatic, doesn't care about Ten-Towns for its own sake, will happily help fight the dragon to test her magic."}

# ==============================================================================
# THE CULT OF AURIL — clarified philosophy
# ==============================================================================

cult_of_auril_design_philosophy:
  core_decision: >
    The cult does NOT resolve as its own plot thread. There is no "defeat the cult" ending
    within this campaign's remaining scope. It exists as MOTIVATION and ATMOSPHERE.
  reeds_homebrew_twist_on_sacrifice: >
    Sacrifice victims in this campaign are WILLING, not lottery-selected against their will.
    Being chosen is treated as an honor. This is Reed's addition.
  sephek_kaltro_redesigned_motive: >
    Sephek kills people who WERE chosen, willingly, but lost their nerve and tried to escape
    — or were rescued by someone who didn't believe. He hunts escapees and finishes what
    Auril "already claimed." Kills the rescuer too.
  auril_alignment_confirmed: "Neutral evil — cold indifference, not active malice or a giver of orders."

