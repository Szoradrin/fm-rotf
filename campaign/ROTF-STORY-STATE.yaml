    - "Arveiaturace appears as the arc's cliffhanger. Not automatically a fight."
    - "Continue toward Auril's island, the Reghed Glacier, and Ythryn."

# Older arc record, kept for its book notes. Where it conflicts with current_plan, current_plan wins.
confirmed_arc_to_ending:
  - beat: "Finish Elven Tomb fight (Ravisin) — DONE"
  - beat: "Lonelywood wrap-up: Ramshackle reward, Nimsy dinner, Sephek ambush, Nimsy's confirmation"
    detail: "Fully built in journal-lonelywood-supplement.json. Sephek dies, Nimsy confirms wound match to Caer-Dineval murder. This is the party's motivation to go to Caer-Dineval. NO overland travel scene — they just arrive."
  - beat: "Black Swords (Caer-Dineval) — OUTCOME NOT RECORDED (party reached Sunblight by Oct 28; Reed to say what happened here)"
    detail: >
      SOURCED FROM BOOK TODAY. The quest location is a single castle/keep — "The Keep at
      Caer-Dineval" — rooms C1-C24, sitting on cliffs over the town and frozen harbor.
      Speaker Crannoc Siever is held under house arrest in C14 (his own bedchamber), guarded
      by one cultist (Yajath). The Knights of the Black Sword control the keep and have been
      posing as his staff, turning away visitors.

      KEY MECHANIC: the Knights answer to Levistus (archdevil, Stygia) via one-way telepathy.
      Levistus has ordered them to ally with any party who satisfies ONE of three conditions:
        1. Has the "Runaway Author" secret (appendix B) — N/A for this party
        2. Found and killed duergar hiding in Dinev's Rest — N/A, not run
        3. Meddled in the affairs of Nildar Sunblight or his older brother Durth (see "The
           Unseen", chapter 2) — TRUE. Party completed The Unseen in Caer-Konig, which
           involved Nildar Sunblight's duergar raiding the town for chardalyn.
      Because condition 3 is already satisfied, THE KNIGHTS WILL STAND DOWN AND WELCOME THE
      PARTY when they arrive/are recognized — no forced combat at the gate. This is a real
      book mechanic, not DM invention.

      Key NPCs actually in the keep:
        - Kadroth: vainglorious tiefling cult fanatic. FALSELY claims a direct line to
          Levistus — he does not actually have one. Levistus secretly despises him. If the
          party kills/harms any cultist OTHER than Kadroth, the alliance breaks. Kadroth
          himself is fair game.
        - Hethyl Arkorran: shield dwarf, peg leg (lost foot to frostbite), the cult's oldest
          member and true soothsayer/backbone. NONCOMBATANT — "too old to harm anyone."
          Blunt, heartless in manner but not cruel for its own sake. Located in C13.
          SHE IS THE INFO SOURCE — see below.
        - Avarice: albino tiefling wizard, Arcane Brotherhood, private quarters in C21.
          Raven familiar named Skelm (NOT the gargoyles). Two gargoyles (Gargle and Gurgle)
          are currently AWAY spying on her wizardly rivals — not present in the keep.
          Levistus already told her not to antagonize this specific party since she needs
          them to help her reach Ythryn (lost Netherese city) and recover the wizard
          Iriolarthas's spellbook. She's cagey, won't discuss why she's there, but is not
          hostile. If she stops feeling safe she simply leaves — she is not a fight-to-the-
          death enemy. If harmed, her gargoyles retaliate later as the party leaves the keep.

      WHAT THE PARTY LEARNS — new reveal, not a confirmation (Reed's party has NOT
      previously connected any dots about a duergar plot — that thread was only ever
      light foreshadowing via chardalyn shards and the name "Nildar Sunblight" during
      The Unseen; nobody has told them it's an active threat until now):
        Hethyl already suspects duergar are plotting against Ten-Towns (this is canon —
        she convinced the cult to forge alliances against the duergar). When she learns
        the party already tangled with Nildar Sunblight's people, that's confirmation for
        her. She (or the book's built-in alternate path: a Ten-Towns speaker, e.g. Crannoc
        himself once freed) can hand the party the real hook — the book's actual mechanism
        is the "Speaker's Quest": a speaker informs the party that duergar have infiltrated
        Ten-Towns for chardalyn and are building "a mighty construct that will lay waste to
        Ten-Towns," names the warlord XARDOROK SUNBLIGHT, and provides a map to his mountain
        fortress (captured/interrogated duergar prisoner as the source of the location).
        This can be voiced through Hethyl and/or newly-freed Crannoc — both work, use
        whichever lands better at the table.

      S23 BOOK CORRECTIONS (read on D&D Beyond 2026-09-23) — these override anything above:
        - Allied Knights will NOT give up Crannoc (their leverage). Yajath (C14) is a cultist, so
          attacking him breaks the alliance — alliance vs. rescue is a real choice.
        - Hethyl delivers four prophecies (Xardorok will conquer the dale; fortress in the Spine with a
          forge powered by a red dragon heart; his plan is findable in the fortress; they die if they face
          him too soon) and then DIES of natural causes. She gives NO map.
        - The map comes from a speaker (ch. 3 Speaker's Quest; Crannoc once free), the Easthaven ferry,
          or a compelled duergar. Six duergar hide in Dinev's Rest in town.
        - Full run sheet: campaign/runsheets/S23-black-swords.md
      Outcome (book): if the party frees Crannoc and routs/allies with the cultists, Crannoc
      restores order, lets the party rest at the castle whenever needed. If Kadroth and
      Hethyl are both removed/dead, Avarice steps up to fill the power vacuum (long-term
      background thread, not needed for this campaign's remaining scope).

  - beat: "Sunblight Fortress — PLAYED OCT 28 (X4 plan found; Xardorok alive; Pleurota not freed; heart intact)"
    detail: >
      Sequestered in the Spine of the World. Home to Xardorok Sunblight, his two living sons,
      and the rest of the Sunblight duergar clan. Xardorok believes his patron is Deep Duerra
      (duergar god of conquest) — he is WRONG. It's actually Asmodeus (Lord of the Nine Hells)
      impersonating Deep Duerra. This matches/confirms the existing Levistus-hides-Asmodeus-
      connection thread already established for the Knights.

      CRITICAL BOOK MECHANIC — "Running This Chapter" states directly: "By the time they
      arrive, Xardorok has already finished his construct and set it loose." THE DRAGON HAS
      ALREADY LAUNCHED REGARDLESS OF PARTY TIMING — not a coincidence tied to arrival, baked
      into the chapter's structure. Arriving at Sunblight always means "too late to stop the
      launch," full stop, no matter what the party does or how fast they get there.

      REED'S DECISION (confirmed, corrects an earlier assistant error that wrongly said the
      fortress would be skipped): the party DOES fight the fortress. This is the mechanical,
      spend-real-session-time CLIMAX of the duergar thread — 2-3 sessions of real dungeon
      crawl: duergar patrols, invisible scouts, Xardorok's sons, and Xardorok himself as a
      genuine boss fight. Even though the dragon is already gone/launched, killing Xardorok
      still matters — it's a real, earned win ("we stopped HIM, even though we were too late
      to stop IT"), not a hollow victory. Beef up Xardorok and the fortress roster for a
      level-6 party of 5 (see leveling plan below).

      "Fortress Fallout" (book, for reference): the dragon won't return to the fortress until
      it destroys Ten-Towns. If Xardorok dies and his forge is intact, the dragon is
      unrepairable.

      OCT 28 OUTCOME (Reed, 2026-11-04; supersedes the kill-Xardorok plan above): the party
      found the X4 flight plan. Xardorok was NOT killed, Pleurota (X19) was NOT freed, and the
      red dragon heart (X24) was NOT destroyed. A living Xardorok can repair the dragon, so
      the repair route stays open. Durth (Xardorok's son, duergar mind master, room X10) was
      left out; use the Duergar Mind Master actor if needed.

  - beat: "Vellynne Harpell — SUPERSEDED: current_plan introduces her after the dragon is destroyed (see open_reconcile)"
    detail: >
      SOURCED FROM BOOK TODAY. Vellynne (Arcane Brotherhood wizard, Host Tower/Luskan) has
      heard of the party's earlier deeds and has been actively searching for them. She
      intercepts them with three dog-sleds (two Icewind kobold zombies, four Icewind kobolds,
      wolf-stock dogs) and offers them a ride back to Ten-Towns. Her real motive: she wants
      to earn their trust so they'll later help her get the Codicil of White (the actual
      chapter-5 endgame hook — held in reserve past the winter break, not resolved now).
      She does NOT care about Ten-Towns' fate for its own sake but is happy to help fight the
      dragon to "test her magic against the mightiest foes."
      This is a clean, book-native way to introduce Vellynne now without derailing the
      ending — she's someone who helps them get back fast, not someone with a demanding
      subplot right now.
      If the party doesn't know where to go, SHE suggests Bryn Shander as the town most
      likely to make a final stand.

  - beat: "Race back to Ten-Towns — SUPERSEDED: the fight is at Easthaven and the dragon never reaches Bryn Shander (route and rules: dragon_scourge below)"
    detail: >
      SOURCED FROM BOOK TODAY. The dragon has a fixed flight path (book's "Dragon Flight
      Times" table) hitting: Dougan's Hole, Good Mead, Easthaven, Caer-Dineval, Caer-Konig,
      Termalaine, Lonelywood, Bremen, Targos, Bryn Shander, then back to Sunblight.
      BRYN SHANDER IS SECOND-TO-LAST — confirmed BOOK CANON as the intended climax target,
      not just Reed's preference. Book explicitly states: "the dragon is saving Bryn Shander
      for last, because Xardorok knows that refugees from the smaller towns have nowhere else
      to go but there. Bryn Shander's walls provide no defense from the sky, and the closer
      Ten-Towners huddle together, the easier it becomes for the dragon to annihilate them."
      This also lines up perfectly with Rhystal's unresolved personal thread (Talen's grove,
      Bryn Shander) — using it as the climax town serves both the book's intended structure
      AND Reed's character-arc needs simultaneously.
      Mechanically: the party's best move (per book) is not to chase the dragon in the air —
      it's faster than any overland or flight speed they'll have — but to get ahead of it and
      wait at Bryn Shander. Vellynne's sleds solve exactly this problem.

  - beat: "ARVEIATURACE CLIFFHANGER — EARLIER DESIGN, SUPERSEDED by current_plan (she appears; no required fight; purpose undecided)"
    detail: >
      Sequence: the party KILLS the chardalyn dragon at Bryn Shander first -- this is a real,
      earned win, not a hollow one. Before they can celebrate or fully recover, Arveiaturace
      (ancient white dragon, allied with Auril) appears in the wreckage, drawn by the
      violence and raw magic of the fight that just happened -- not because the construct
      dragon survived or died, just because of the scale of what just occurred.

      She attacks. The party is already resource-depleted from two fights in a row (Sunblight
      Fortress + the chardalyn dragon) when she shows up, so this is not a fair fight, and
      it's not supposed to be. Reed will beef her up for the scene on top of her already
      being a near-unbeatable threat for a level 7 party.

      CRITICAL TONE NOTE: she does NOT defeat the party through overwhelming force in a
      dramatic curbstomp, and she does NOT negotiate (dragons don't negotiate with "lower
      life forms," per Reed). Instead: she is CONTEMPTUOUS, not threatened. She doesn't
      consider the party worth the effort of a real fight. The party is forced to retreat --
      not because she crushes them, but because continuing to fight her is clearly suicidal
      and she makes that obvious rather than proving it by killing anyone. She may blast Bryn
      Shander a bit more just because she can, then simply leaves -- "not worth my time" is
      the whole beat.

      FREEZE THE GAME immediately after the party retreats / she departs. Do not resolve
      anything further -- no aftermath scene, no dialogue with her, no negotiation. The
      cliffhanger IS the freeze: they won one fight, got no time to celebrate, and got
      reminded there's something in this world far above their weight class.

      STORY WEIGHT: per the book, Arveiaturace has no real plot-mechanical consequences tied
      to this encounter -- she's flavor/a set-piece, not a gear in the main plot. The real
      next-arc content is Vellynne's Codicil of White / Ythryn hook (chapter 5+), which is
      unaffected by whether Arveiaturace is killed, flees, or just leaves on her own. Do NOT
      feel obligated to manufacture follow-up consequences for her when the campaign resumes
      unless Reed wants them -- the emotional beat (relief, then dread) is the entire payoff.
    status: "Superseded 2026-11-04. Kept for tone notes only."

